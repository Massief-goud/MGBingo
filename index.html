.tabs{display:flex;gap:10px;margin-bottom:15px}
button{padding:10px 14px;border:none;border-radius:8px;cursor:pointer;background:rgba(68, 68, 68, 0.9);color:white;font-weight:bold}
button:hover{background:rgba(85, 85, 85, 0.9)}
.btn-save{background:rgba(0, 188, 212, 0.9);color:black}
.btn-screenshot{background:rgba(76, 175, 80, 0.9);color:white}
.btn-preview{background:rgba(255, 152, 0, 0.9);color:black}
input{padding:10px;border-radius:8px;border:none;background:rgba(34, 34, 34, 0.9);color:white;border:1px solid #444}
.panel{display:none}
.panel.active{display:block}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}

/* Bingo Kaart - NIEUWE TEMPLATE */
.bingo-board{
 position:relative;width:min(90vw,620px);aspect-ratio:1233/1337;margin:0 auto;container-type:inline-size;
 background:url('./bingo-template.png') center/100% 100% no-repeat;
}
.team-overlay {
 position:absolute;top:22.3%;left:55%;transform:translate(-50%,-50%);
 max-width:62%;padding:.15em 1.1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
 font-family:Copperplate,'Copperplate Gothic Bold',Cinzel,Georgia,serif;
 font-size:2.3cqw;font-weight:bold;letter-spacing:.12em;text-transform:uppercase;
 color:#f5d76e;background:rgba(12,9,5,.96);border:1px solid #c9952b;border-radius:4px;
 text-shadow:1px 1px 4px rgba(0,0,0,.9);pointer-events:none;z-index:7;
}
.team-overlay:empty{display:none}
.grid{
 position:absolute;top:24.16%;left:6.16%;width:86.94%;height:72.03%;
 display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);
}
.cell{position:relative;cursor:pointer}
.cell.checked::before,.cell.checked::after{
 content:"";position:absolute;top:50%;left:50%;
 width:70%;height:8px;background:rgba(0,255,80,.55);border-radius:999px;
}
.cell.checked::before{transform:translate(-50%,-50%) rotate(45deg)}
.cell.checked::after{transform:translate(-50%,-50%) rotate(-45deg)}

/* Overzichtskaarten */
.public-grid-container {
 display:grid;grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));gap:20px;margin-top:15px;
}
.public-card {
 background:rgba(34, 34, 34, 0.9);border:1px solid #333;border-radius:12px;padding:15px;
 display:flex;flex-direction:column;align-items:center;gap:10px;
}
.public-card h3 {
 margin:0;font-size:16px;text-transform:uppercase;color:#f5d76e;text-align:center;
 width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.mini-board {
 position:relative;width:100%;aspect-ratio:1/1;
 background:url('./bingo-template.png') center/contain no-repeat;
}
.mini-grid {
 position:absolute;top:24.16%;left:6.16%;width:86.94%;height:72.03%;
 display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);
}
.mini-cell { position:relative; }
.mini-cell.checked::before,.mini-cell.checked::after{
 content:"";position:absolute;top:50%;left:50%;
 width:70%;height:3px;background:rgba(0,255,80,.8);border-radius:999px;
}
.mini-cell.checked::before{transform:translate(-50%,-50%) rotate(45deg)}
.mini-cell.checked::after{transform:translate(-50%,-50%) rotate(-45deg)}
.public-card button { width:100%; margin-top:5px; }

/* Preview Modal */
.preview-modal {
 display:none;position:fixed;top:0;left:0;width:100%;height:100%;
 background:rgba(0,0,0,0.9);z-index:9999;justify-content:center;align-items:center;
 padding:20px;
}
.preview-modal.active { display:flex; }
.modal-content {
 position:relative;width:100%;max-width:650px;
 display:flex;flex-direction:column;gap:15px;
}
.modal-close {
 position:absolute;top:-45px;right:0;font-size:32px;color:white;
 background:none;border:none;cursor:pointer;font-weight:bold;
}
.modal-close:hover { color:#ff9800; }

/* Win Highlights */
.win-overlay {
  position: absolute;
  background: rgba(0, 255, 80, 0.28);
  box-shadow: 0 0 30px rgba(0, 255, 80, 0.75);
  pointer-events: none;
  z-index: 5;
  border-radius: 8px;
}
.global-win-overlay {
  position: absolute;
  background: rgba(220, 20, 60, 0.55);
  box-shadow: 0 0 40px rgba(220, 20, 60, 0.9);
  pointer-events: none;
  z-index: 6;
  border-radius: 8px;
}
/* De eerste kaart met een complete verticale kolom krijgt groen; dezelfde kolom blijft rood op andere kaarten. */
.global-win-overlay.winner-line {
  background: rgba(0, 255, 80, 0.35);
  box-shadow: 0 0 30px rgba(0, 255, 80, 0.8);
}
</style>
</head>
<body>

<div class="tabs">
<button onclick="showTab('public')">Overzicht Kaarten</button>
<button onclick="showTab('editor')">Bingo Kaart Editor</button>
<button onclick="showTab('saved')">Opgeslagen Kaarten (Staff)</button>
</div>

<!-- Openbaar overzicht -->
<div id="public" class="panel active">
<h2>Actueel Overzicht van alle deelnemende kaarten</h2>
<p>Klik op "Bekijken" om een kaart te bekijken.</p>
<button class="btn-screenshot" onclick="takeAllCardsScreenshot()" style="margin-bottom:15px;">
📷 Screenshot van alle kaarten
</button>
<div id="publicCardsContainer" class="public-grid-container"></div>
</div>

<!-- Editor -->
<div id="editor" class="panel">
<div class="controls">
<input id="teamName" placeholder="Teamnaam" oninput="updateTeamOverlay()">
<button class="btn-save" onclick="saveCard()">💾 Opslaan</button>
<button class="btn-screenshot" onclick="takeScreenshot()">📷 Screenshot</button>
<button onclick="newCard()">Nieuwe kaart</button>
</div>

<div class="bingo-board">
<div id="teamOverlay" class="team-overlay"></div>
<div class="grid" id="grid"></div>
</div>
</div>

<!-- Staff paneel -->
<div id="saved" class="panel">
<h2>Opgeslagen kaarten (Beheer)</h2>
<div id="savedCards"></div>
</div>

<!-- Preview Modal -->
<div id="previewModal" class="preview-modal" onclick="closePreview(event)">
 <div class="modal-content" onclick="event.stopPropagation()">
   <button class="modal-close" onclick="closePreview(null)">&times;</button>
   <div class="bingo-board">
     <div id="previewTeamOverlay" class="team-overlay"></div>
     <div id="previewGrid" class="grid"></div>
   </div>
 </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script>
const PASSWORD_HASH = "10f177ad50c7716e10575b29a9dd99705e463b1dbdb5f0c0655377903ec4c6d7";
const SALT = "mg-bingo-7f3a";
let editUnlocked = false;

function sha256(str){
  const rr=(v,a)=>(v>>>a)|(v<<(32-a));
  const K=[],H=[];let pc=0;const ic={};
  for(let c=2;pc<64;c++){if(!ic[c]){for(let i=0;i<313;i+=c)ic[i]=c;H[pc]=(Math.pow(c,.5)*4294967296)|0;K[pc++]=(Math.pow(c,1/3)*4294967296)|0;}}
  str=unescape(encodeURIComponent(str));
  const words=[];let len=str.length;
  for(let i=0;i<len;i++)words[i>>2]|=str.charCodeAt(i)<<(24-(i%4)*8);
  words[len>>2]|=0x80<<(24-(len%4)*8);
  words[(((len+8)>>6)<<4)+15]=len*8;
  let h=H.slice(0,8);
  for(let j=0;j<words.length;){
    const w=words.slice(j,j+=16),o=h.slice(0);
    for(let i=0;i<64;i++){
      const w15=w[i-15],w2=w[i-2],a=h[0],e=h[4];
      const t1=h[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&h[5])^(~e&h[6]))+K[i]+(w[i]=(i<16)?(w[i]|0):(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      const t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&h[1])^(a&h[2])^(h[1]&h[2]));
      h=[(t1+t2)|0].concat(h);h[4]=(h[4]+t1)|0;h.pop();
    }
    for(let i=0;i<8;i++)h[i]=(h[i]+o[i])|0;
  }
  return h.map(x=>('00000000'+(x>>>0).toString(16)).slice(-8)).join('');
}

document.addEventListener("DOMContentLoaded", () => {
  loadPublicCards();
  buildEditorGrid();
  buildPreviewGrid();
});

function unlockEdit(){
 if(editUnlocked) return true;
 const p = prompt("Voer beheerderscode in:");
 if(p !== null && sha256(SALT + p) === PASSWORD_HASH){ editUnlocked = true; return true; }
 alert("Onjuiste code");
 return false;
}

function showTab(id){
 document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
 document.getElementById(id).classList.add('active');
 if(id === 'saved') loadSavedCards();
 if(id === 'public') loadPublicCards();
}

function updateTeamOverlay() {
 const name = document.getElementById('teamName').value;
 document.getElementById('teamOverlay').innerText = name;
}

// GLOBAL WINS + overige functies blijven hetzelfde als vorige versie
let bingoCards = [];
const SUPABASE_URL = "https://fjzwtjgtmlrcwiytpyqw.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZqend0amd0bWxyY3dpeXRweXF3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1OTE1ODIsImV4cCI6MjA5NjE2NzU4Mn0.ne13FbGpwDq-qINjCCFBsM6EZgJeJK3LjxxEGM8Qw9M";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function refreshCards() {
  const { data, error } = await supabaseClient
    .from('bingo_cards')
    .select('team, checked, line_completed_at, winning_column, line_completions')
    .order('team');
  if (error) {
    console.error('Supabase kaarten ophalen mislukt:', error);
    alert('Kaarten laden mislukt. Voer eerst de Supabase SQL-aanpassing uit die bij deze versie hoort.');
    return false;
  }
  bingoCards = (data || []).map(card => ({
    team: card.team,
    checked: Array.isArray(card.checked) ? card.checked : [],
    line_completed_at: card.line_completed_at || null,
    winning_column: Number.isInteger(card.winning_column) ? card.winning_column : null,
    line_completions: card.line_completions && typeof card.line_completions === 'object' ? card.line_completions : {}
  }));
  return true;
}
function getCard(team) { return bingoCards.find(card => card.team === team) || null; }

// Alleen verticale kolommen tellen. Elke kolom heeft een eigen eerste winnaar.
function hasVerticalLine(checkedIndices, column) {
  const checked = new Set(checkedIndices || []);
  return [0, 1, 2, 3, 4].every(row => checked.has(row * 5 + column));
}
function getGlobalWins() {
  const winnersByColumn = {};
  bingoCards.forEach(card => {
    const completions = { ...(card.line_completions || {}) };
    // Compatibiliteit met eerder opgeslagen kaarten die nog maar één winnaar-kolom hadden.
    if (card.line_completed_at && Number.isInteger(card.winning_column) && !completions[card.winning_column]) {
      completions[card.winning_column] = card.line_completed_at;
    }
    Object.entries(completions).forEach(([colText, timestamp]) => {
      const col = Number(colText);
      if (!Number.isInteger(col) || col < 0 || col > 4 || !timestamp) return;
      const current = winnersByColumn[col];
      if (!current || new Date(timestamp).getTime() < new Date(current.timestamp).getTime()) {
        winnersByColumn[col] = { team: card.team, timestamp };
      }
    });
  });
  return { winnersByColumn };
}

function updateWinHighlights() {
  const checked = Array.from(document.querySelectorAll('#grid .cell')).map((c, i) => c.classList.contains('checked') ? i : -1).filter(i => i >= 0);
  const container = document.getElementById('grid');
  document.querySelectorAll('#grid .win-overlay, #grid .global-win-overlay').forEach(el => el.remove());
  const winnersByColumn = getGlobalWins().winnersByColumn;
  const currentTeam = document.getElementById('teamName').value.trim();
  for (let col = 0; col < 5; col++) {
    const winner = winnersByColumn[col];
    if (winner) {
      createWinOverlay(container, 'col', col, currentTeam === winner.team ? 'win-overlay' : 'global-win-overlay');
    } else if (hasVerticalLine(checked, col)) {
      // Nog niet opgeslagen kandidaat; na opslaan wordt deze kolom aan de eerste winnaar toegewezen.
      createWinOverlay(container, 'col', col, 'win-overlay');
    }
  }
}

function createWinOverlay(container, type, index, className = 'win-overlay') {
  // Alleen kolommen van boven naar beneden zijn geldig.
  if (type !== 'col') return;
  const overlay = document.createElement('div');
  overlay.className = className;
  overlay.style.top = '0%';
  overlay.style.left = `${index * 20}%`;
  overlay.style.width = '20%';
  overlay.style.height = '100%';
  container.appendChild(overlay);
}

function buildEditorGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  for(let i = 0; i < 25; i++){
    let c = document.createElement('div');
    c.className = 'cell';
    c.onclick = () => {
      if(!unlockEdit()) return;
      c.classList.toggle('checked');
      updateWinHighlights();
    };
    grid.appendChild(c);
  }
}

function buildPreviewGrid() {
  const pGrid = document.getElementById('previewGrid');
  pGrid.innerHTML = '';
  for(let i = 0; i < 25; i++){
    let c = document.createElement('div');
    c.className = 'cell';
    pGrid.appendChild(c);
  }
}

async function loadPublicCards(){
  const container = document.getElementById('publicCardsContainer');
  container.innerHTML = '<p>Kaarten laden...</p>';
  if (!(await refreshCards())) return;
  container.innerHTML = '';
  const global = getGlobalWins();
  if(!bingoCards.length) {
    container.innerHTML = '<p style="grid-column: 1/-1; color: #aaa;">Nog geen bingokaarten opgeslagen.</p>';
    return;
  }
  bingoCards.forEach(data => {
    const cardDiv = document.createElement('div'); cardDiv.className = 'public-card';
    const heading = document.createElement('h3'); heading.textContent = data.team; cardDiv.appendChild(heading);
    const board = document.createElement('div'); board.className = 'mini-board';
    const miniGrid = document.createElement('div'); miniGrid.className = 'mini-grid'; board.appendChild(miniGrid); cardDiv.appendChild(board);
    const previewButton = document.createElement('button'); previewButton.className = 'btn-preview'; previewButton.textContent = 'Bekijken';
    previewButton.addEventListener('click', () => openPreview(data.team)); cardDiv.appendChild(previewButton);
    for(let i=0;i<25;i++) { const cell=document.createElement('div'); cell.className='mini-cell'; if(data.checked.includes(i)) cell.classList.add('checked'); miniGrid.appendChild(cell); }
    Object.entries(global.winnersByColumn).forEach(([colText, winner]) => {
      const col = Number(colText);
      const el = document.createElement('div');
      el.className = 'global-win-overlay';
      if (data.team === winner.team) el.classList.add('winner-line');
      el.style.top = '0%'; el.style.left = `${col * 20}%`;
      el.style.width = '20%'; el.style.height = '100%';
      miniGrid.appendChild(el);
    });
    container.appendChild(cardDiv);
  });
}

function openPreview(teamName) {
  const data = getCard(teamName);
  if(!data) return;
 
  document.getElementById('previewTeamOverlay').innerText = data.team;
 
  const previewCells = document.querySelectorAll('#previewGrid .cell');
  previewCells.forEach((cell, i) => cell.classList.toggle('checked', data.checked.includes(i)));
 
  const previewGrid = document.getElementById('previewGrid');
  document.querySelectorAll('#previewGrid .win-overlay, #previewGrid .global-win-overlay').forEach(el => el.remove());
 
  const global = getGlobalWins();
  Object.entries(global.winnersByColumn).forEach(([colText, winner]) => {
    const col = Number(colText);
    const lineClass = data.team === winner.team ? 'global-win-overlay winner-line' : 'global-win-overlay';
    createWinOverlay(previewGrid, 'col', col, lineClass);
  });
 
  document.getElementById('previewModal').classList.add('active');
}

// Screenshot alle kaarten
async function takeAllCardsScreenshot() {
  const tempContainer = document.createElement('div');
  tempContainer.style.position = 'absolute';
  tempContainer.style.left = '-9999px';
  tempContainer.style.background = '#111';
  tempContainer.style.padding = '40px';
  tempContainer.style.width = '820px';
  document.body.appendChild(tempContainer);

  const title = document.createElement('h2');
  title.textContent = 'Massief Goud Bingo - Alle Kaarten';
  title.style.color = '#fff';
  title.style.textAlign = 'center';
  title.style.marginBottom = '40px';
  tempContainer.appendChild(title);

  document.querySelectorAll('.public-card').forEach(card => {
    const clone = card.cloneNode(true);
    clone.style.marginBottom = '50px';
    clone.style.boxShadow = '0 15px 35px rgba(0,0,0,0.7)';
    tempContainer.appendChild(clone);
  });

  try {
    const canvas = await html2canvas(tempContainer, { scale: 2, backgroundColor: '#111' });
    const link = document.createElement('a');
    link.download = `Massief_Goud_Bingo_Alle_Kaarten_${new Date().toISOString().slice(0,10)}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  } catch(e) {
    alert('Screenshot maken mislukt.');
  }

  document.body.removeChild(tempContainer);
}

// Overige functies (save, edit, delete, screenshot)
async function saveCard(){
  if(!unlockEdit()) return;
  const team = document.getElementById('teamName').value.trim();
  if(!team) return alert('Voer een teamnaam in');
  const checked=[];
  document.querySelectorAll('#grid .cell').forEach((c,i)=>{if(c.classList.contains('checked')) checked.push(i);});
  // Elke unieke verticale kolom krijgt een eigen eerste winnaar. Bestaande tijdstempels blijven behouden.
  const existing = getCard(team);
  const line_completions = { ...(existing?.line_completions || {}) };
  if (existing?.line_completed_at && Number.isInteger(existing?.winning_column) && !line_completions[existing.winning_column]) {
    line_completions[existing.winning_column] = existing.line_completed_at;
  }
  for (let col = 0; col < 5; col++) {
    if (hasVerticalLine(checked, col) && !line_completions[col]) {
      line_completions[col] = new Date().toISOString();
    }
  }
  const firstCompletion = Object.entries(line_completions).sort((a, b) => new Date(a[1]) - new Date(b[1]))[0];
  const line_completed_at = firstCompletion ? firstCompletion[1] : null;
  const winning_column = firstCompletion ? Number(firstCompletion[0]) : null;
  const {error}=await supabaseClient.from('bingo_cards').upsert(
    {team, checked, line_completed_at, winning_column, line_completions},
    {onConflict:'team'}
  );
  if(error){console.error(error);alert('Kaart opslaan mislukt. Controleer de Supabase-tabel en toegangsregels.');return;}
  await refreshCards(); alert('Kaart opgeslagen!'); await loadSavedCards(); await loadPublicCards();
}

function newCard(){
  document.getElementById('teamName').value = '';
  updateTeamOverlay();
  document.querySelectorAll('#grid .cell').forEach(c => c.classList.remove('checked'));
  updateWinHighlights();
}

async function loadSavedCards(){
  const container=document.getElementById('savedCards'); container.innerHTML='<p>Kaarten laden...</p>';
  if(!(await refreshCards())) return;
  container.innerHTML='';
  bingoCards.forEach(data=>{
    const row=document.createElement('div'); row.className='card-item';
    const label=document.createElement('span'); label.textContent=data.team;
    const actions=document.createElement('span');
    const edit=document.createElement('button'); edit.textContent='Bewerken'; edit.addEventListener('click',()=>editCard(data.team));
    const del=document.createElement('button'); del.textContent='Verwijderen'; del.addEventListener('click',()=>deleteCard(data.team));
    actions.append(edit,del); row.append(label,actions); container.appendChild(row);
  });
}

function editCard(team){
  if(!unlockEdit()) return;
  const data = getCard(team);
  showTab('editor');
  newCard();
  document.getElementById('teamName').value = data.team;
  updateTeamOverlay();
  data.checked.forEach(i => document.querySelectorAll('#grid .cell')[i].classList.add('checked'));
  updateWinHighlights();
}

async function deleteCard(team){
  if(!unlockEdit()) return;
  if(confirm('Kaart verwijderen?')){
    const {error}=await supabaseClient.from('bingo_cards').delete().eq('team',team);
    if(error){console.error(error);alert('Kaart verwijderen mislukt. Controleer de Supabase-toegangsregels.');return;}
    await refreshCards(); await loadSavedCards(); await loadPublicCards();
  }
}

function takeScreenshot() {
  const teamName = document.getElementById('teamName').value.trim() || "Massief Goud Bingo";
  const checked = [];
  document.querySelectorAll('#grid .cell').forEach((c,i) => {
    if(c.classList.contains('checked')) checked.push(i);
  });
  
  const img = new Image();
  img.crossOrigin = "anonymous";
  img.src = './bingo-template.png';
  img.onload = function() {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = img.width; canvas.height = img.height;
    ctx.drawImage(img, 0, 0);
   
    const W = canvas.width, H = canvas.height;

    // Teamnaam-plaquette (zelfde plek als in de editor)
    if(document.getElementById('teamName').value.trim()) {
      const fs = W * 0.023;
      ctx.font = `bold ${fs}px Copperplate, 'Copperplate Gothic Bold', Cinzel, Georgia, serif`;
      const txt = teamName.toUpperCase().split('').join('\u200A');
      const tw = Math.min(ctx.measureText(txt).width, W * 0.62 - fs * 2.2);
      const bw = tw + fs * 2.2, bh = fs * 1.5;
      const bx = W * 0.55 - bw / 2, by = H * 0.223 - bh / 2;
      ctx.fillStyle = "rgba(12,9,5,0.96)";
      ctx.strokeStyle = "#c9952b";
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 4); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#f5d76e";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(txt, bx + bw / 2, by + bh / 2 + fs * 0.05, tw);
    }

    // Raster 5x5
    const gridLeft = W * 0.0616;
    const gridTop  = H * 0.2416;
    const cellW = (W * 0.8694) / 5;
    const cellH = (H * 0.7203) / 5;
    const half = Math.min(cellW, cellH) * 0.33;

    ctx.strokeStyle = "rgba(0, 255, 80, 0.6)";
    ctx.lineWidth = Math.min(cellW, cellH) * 0.09;
    ctx.lineCap = "round";
    checked.forEach(index => {
      const row = Math.floor(index / 5);
      const col = index % 5;
      const cx = gridLeft + col * cellW + cellW / 2;
      const cy = gridTop + row * cellH + cellH / 2;
      ctx.beginPath(); ctx.moveTo(cx - half, cy - half); ctx.lineTo(cx + half, cy + half); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx - half, cy + half); ctx.lineTo(cx + half, cy - half); ctx.stroke();
    });

    const link = document.createElement('a');
    link.download = `Bingo_${teamName.replace(/[^a-z0-9]/gi, '_')}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  };
}

function closePreview(event) {
  if(!event || event.target.id === 'previewModal') {
    document.getElementById('previewModal').classList.remove('active');
  }
}
</script>
</body>
